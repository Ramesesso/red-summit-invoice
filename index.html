<!DOCTYPE html>
<html>
<head>
    <title>Red Summit - Invoice Generator (Web Version)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        .app-container { display: flex; height: 100vh; width: 100vw; overflow: hidden; }

        /* Left Panel */
        .left-panel { flex: 6; padding: 20px; overflow-y: auto; background-color: #f9f9f9; box-sizing: border-box; }
        .right-panel { flex: 8; background-color: #525659; }

        h2 { margin-top: 0; }
        .form-grid { display: grid; grid-template-columns: 140px 1fr; gap: 8px; margin-bottom: 20px; align-items: center; }
        .form-grid label { font-weight: bold; font-size: 13px; text-align: right; padding-right: 10px; }
        .form-grid input, .form-grid textarea { padding: 6px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; font-family: inherit;}

        /* Editable Table Styles */
        table { width: 100%; border-collapse: collapse; margin-top: 5px; background: white; margin-bottom: 15px;}
        th, td { border: 1px solid #ddd; padding: 0; text-align: left; font-size: 13px; }
        th { background-color: #eaeaea; padding: 8px; }

        /* Make table cells act like Excel inputs */
        table input { width: 100%; height: 100%; border: none; padding: 8px; box-sizing: border-box; font-family: inherit; font-size: inherit; background: transparent; outline: none; }
        table input:focus { background: #f0f8ff; box-shadow: inset 0 0 0 1px #007bff; }
        .amt-cell { padding: 8px; background: #f8f9fa; }

        .btn { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-green { background: #28a745; margin-bottom: 15px; width: 100%; font-size: 14px; padding: 12px;}
        .btn-small { padding: 5px 10px; background: #6c757d; font-size: 12px; margin-bottom: 5px;}
        .btn-del { background: #dc3545; padding: 6px 10px; border-radius: 3px; border: none; color: white; cursor: pointer; font-weight: bold; width: 100%;}

        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- LEFT PANEL -->
        <div class="left-panel">
            <h2>Red Summit - Web Editor</h2>

            <input type="file" id="csvFile" accept=".csv" style="display: none;">
            <button class="btn btn-green" onclick="document.getElementById('csvFile').click()">Load Customer CSV</button>

            <div class="form-grid">
                <label>Invoice Number:</label> <input type="text" id="invNum" value="RSL2026PI" onchange="updatePreview()">
                <label>Date:</label> <input type="text" id="date" value="14/Sep/2026" onchange="updatePreview()">
                <label>Customer Name:</label> <input type="text" id="custName" value="Cesium Telecom" onchange="updatePreview()">
                <label>PO Number:</label> <input type="text" id="poNum" value="" onchange="updatePreview()">
                <label>Address:</label> <textarea id="address" rows="3" onchange="updatePreview()">5798 Ferrier&#10;Mont-Royal&#10;QC H4P 1M7&#10;Canada</textarea>
                <label>Attn:</label> <input type="text" id="attn" value="Camilo Florez" onchange="updatePreview()">
                <label>Phone:</label> <input type="text" id="phone" value="+1 877-798-8686" onchange="updatePreview()">
                <label>Loading Port:</label> <input type="text" id="loadingPort" value="Hong Kong, Hong Kong" onchange="updatePreview()">
                <label>Discharge Port:</label> <input type="text" id="dischargePort" value="Canada, Canada" onchange="updatePreview()">
                <label>ETD:</label> <input type="text" id="etd" value="14/Sep/2026" onchange="updatePreview()">
                <label>Incoterm:</label> <input type="text" id="incoterm" value="[EXW] EX WORKS" onchange="updatePreview()">
                <label>Payment Term:</label> <input type="text" id="paymentTerm" value="100% T/T Before Shipment" onchange="updatePreview()">
                <label>Currency:</label> <input type="text" id="currency" value="USD" onchange="updatePreview()">
            </div>

            <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                <h3 style="margin: 0;">Line Items</h3>
                <button class="btn btn-small" onclick="addRow()">+ Add Row</button>
            </div>

            <table id="itemsTable">
                <thead>
                    <tr>
                        <th style="width: 15%;">UPC</th>
                        <th style="width: 40%;">Description</th>
                        <th style="width: 12%;">Qty</th>
                        <th style="width: 15%;">Price</th>
                        <th style="width: 13%;">Amount</th>
                        <th style="width: 5%;"></th>
                    </tr>
                </thead>
                <tbody>
                    <!-- JS dynamically injects rows here -->
                </tbody>
            </table>

            <div class="form-grid" style="margin-top: 20px;">
                <label>Bank Info:</label>
                <textarea id="bankInfo" rows="4" onchange="updatePreview()">Beneficiary Banker: HSBC HONG KONG&#10;Beneficiary Banker Address: No.1 Queen's Road Central, Central, Hong Kong&#10;Beneficiary Account Name: Red Summit Limited&#10;Beneficiary Account Number: 747008514838&#10;SWIFT CODE: HSBCHKHHHKH</textarea>
            </div>

            <button class="btn" onclick="updatePreview()" style="width:100%; padding: 15px;">Refresh / Generate Final PDF</button>
        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel">
            <iframe id="pdfPreview"></iframe>
        </div>
    </div>

    <script>
        let loadedItems = [];

        // 1. Initial Render
        renderTable();

        // 2. CSV Import Logic
        document.getElementById('csvFile').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const data = results.data;
                    if (data.length > 0) {
                        document.getElementById('poNum').value = "PO " + (data[0]['Document Number'] || "");
                        loadedItems = data.map(row => ({
                            upc: row['Item UPC'] || "",
                            description: row['Description'] || "",
                            quantity: parseFloat(row['Ordered']) || 0,
                            unit_price: parseFloat(row['Unit Price']) || 0
                        }));
                        renderTable();
                        updatePreview();
                    }
                }
            });
            // Reset input so you can select the same file twice if needed
            event.target.value = "";
        });

        // 3. Add & Delete Rows
        function addRow() {
            loadedItems.push({ upc: "", description: "", quantity: 0, unit_price: 0 });
            renderTable();
        }

        function deleteRow(index) {
            loadedItems.splice(index, 1);
            renderTable();
            updatePreview();
        }

        // 4. Update internal data when user types, recalculate amount
        function handleInput(index, field, value) {
            if (field === 'quantity' || field === 'unit_price') {
                loadedItems[index][field] = parseFloat(value) || 0;
                const amt = (loadedItems[index].quantity * loadedItems[index].unit_price).toFixed(2);
                document.getElementById(`amt-${index}`).innerText = `$${amt}`;
            } else {
                loadedItems[index][field] = value;
            }
        }

        // 5. Excel Paste Listener
        document.getElementById('itemsTable').addEventListener('paste', function(e) {
            const text = (e.clipboardData || window.clipboardData).getData('text');
            if (!text) return;

            // Check if the pasted text has tabs (Excel columns) or newlines (multiple rows)
            if (text.includes('\t') || text.includes('\n')) {
                e.preventDefault(); // Stop standard pasting

                const lines = text.split('\n');
                lines.forEach(line => {
                    if (!line.trim()) return;
                    const cols = line.split('\t');
                    loadedItems.push({
                        upc: cols[0] || "",
                        description: cols[1] || "",
                        quantity: parseFloat(cols[2]) || 0,
                        unit_price: parseFloat(cols[3]) || 0
                    });
                });
                renderTable();
                updatePreview();
            }
            // If there are no tabs/newlines, do nothing!
            // The browser will naturally paste the text into the box you clicked.
        });


        // 6. Draw Table
        function renderTable() {
            const tbody = document.querySelector('#itemsTable tbody');
            tbody.innerHTML = "";

            if (loadedItems.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:15px; color:#888;">No items. Click '+ Add Row' or Load CSV.</td></tr>`;
                return;
            }

            loadedItems.forEach((item, index) => {
                const amount = (item.quantity * item.unit_price).toFixed(2);
                tbody.innerHTML += `
                    <tr>
                        <td><input type="text" value="${item.upc}" oninput="handleInput(${index}, 'upc', this.value)" onchange="updatePreview()"></td>
                        <td><input type="text" value="${item.description}" oninput="handleInput(${index}, 'description', this.value)" onchange="updatePreview()"></td>
                        <td><input type="number" step="any" value="${item.quantity}" oninput="handleInput(${index}, 'quantity', this.value)" onchange="updatePreview()"></td>
                        <td><input type="number" step="any" value="${item.unit_price}" oninput="handleInput(${index}, 'unit_price', this.value)" onchange="updatePreview()"></td>
                        <td class="amt-cell" id="amt-${index}">$${amount}</td>
                        <td><button class="btn-del" onclick="deleteRow(${index})">X</button></td>
                    </tr>
                `;
            });
        }

        // 7. Request PDF from Python Backend
        async function updatePreview() {
            const data = {
                invoice_num: document.getElementById('invNum').value,
                date: document.getElementById('date').value,
                customer_name: document.getElementById('custName').value,
                po_number: document.getElementById('poNum').value,
                address: document.getElementById('address').value,
                attn: document.getElementById('attn').value,
                phone: document.getElementById('phone').value,
                loading_port: document.getElementById('loadingPort').value,
                discharge_port: document.getElementById('dischargePort').value,
                etd: document.getElementById('etd').value,
                incoterm: document.getElementById('incoterm').value,
                payment_term: document.getElementById('paymentTerm').value,
                currency: document.getElementById('currency').value,
                bank_info: document.getElementById('bankInfo').value,
                items: loadedItems
            };

            try {
                const response = await fetch("/generate_pdf", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    document.getElementById('pdfPreview').src = url;
                }
            } catch (e) {
                console.error("Error connecting to Python backend:", e);
            }
        }
    </script>
</body>
</html>
